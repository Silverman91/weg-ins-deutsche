<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weg ins Deutsche</title>
<meta name="description" content="Learn German offline, from zero to C1: lessons, flashcards, speaking role-plays and stories.">
<meta name="theme-color" content="#9B2C2C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: phone app shell — compact sticky header, one scrolling view, fixed bottom tab bar; azulejo-tile badges mark CEFR levels */
:root{
  --bg:#F8F6F4; --surface:#FFFFFF; --ink:#1E1A18; --muted:#6B625C; --line:#E6DFDA;
  --tile:#9B2C2C; --tile-soft:#F7E5E2; --saffron:#E0A100; --saffron-soft:#FFF3D1; --ok:#1E8A5A; --ok-soft:#DDF3E8; --bad:#C2413A; --bad-soft:#FBE3E1;
  --f-display:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:ui-monospace, "Roboto Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161211; --surface:#201A18; --ink:#F3ECE8; --muted:#ADA29B; --line:#3A302C;
  --tile:#F08A80; --tile-soft:#3A1F1F; --saffron:#F2BE3A; --saffron-soft:#33290F; --ok:#4CC38A; --ok-soft:#14301F; --bad:#F07A72; --bad-soft:#3A1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161211; --surface:#201A18; --ink:#F3ECE8; --muted:#ADA29B; --line:#3A302C;
  --tile:#F08A80; --tile-soft:#3A1F1F; --saffron:#F2BE3A; --saffron-soft:#33290F; --ok:#4CC38A; --ok-soft:#14301F; --bad:#F07A72; --bad-soft:#3A1A18; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
a{color:var(--tile)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:6px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:grid;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--tile)}
.lvl{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.lvl b{color:var(--ink)}
.bar{height:6px;border-radius:99px;background:var(--tile-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tile);border-radius:99px;transition:width .4s}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.bottom button{background:none;border:0;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;min-width:0;position:relative}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--tile)}
nav.bottom button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--saffron)}
nav.bottom .dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--saffron);color:#1a1a1a;font-size:10px;line-height:16px;font-family:var(--f-mono)}

main .wrap{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.intro{color:var(--muted);max-width:62ch}
.intro b{color:var(--ink)}
.note{font-size:13px;color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:19px;font-weight:600}
.card h3{font-size:16px;font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;text-align:center}
.btn.primary{background:var(--tile);border-color:var(--tile);color:var(--surface)}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--tile);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.alert{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--saffron-soft)}
.badge{font-family:var(--f-mono);font-size:13px;font-weight:500;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--tile-soft);color:var(--tile);
  background-image:linear-gradient(45deg,transparent 46%,color-mix(in srgb,var(--tile) 18%,transparent) 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,color-mix(in srgb,var(--tile) 18%,transparent) 46% 54%,transparent 54%)}
.badge.done{background-color:var(--ok);color:var(--surface);background-image:none}

/* today */
.hello{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.hello h2{font-size:26px;font-weight:800}
.streak{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.streak b{font-family:var(--f-display);font-size:28px;color:var(--saffron);margin-right:4px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--surface)}
.tick.on{background:var(--ok);border-color:var(--ok)}
.step b{display:block}
.step small{color:var(--muted);font-size:13px;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--tile-soft);border-radius:10px;padding:10px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}

/* lessons list */
.phase-head{display:flex;gap:12px;align-items:center}
.phase-head .t{min-width:0;flex:1}
.phase-head .when{font-size:13px;color:var(--muted)}
.lrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.lrow .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lrow .st{font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.lrow.done .st{color:var(--ok)}
.lrow.next{background:var(--saffron-soft);border-radius:10px;padding-inline:8px;border-top-color:transparent}

/* lesson */
.back{justify-self:start}
.lesson-title{display:flex;gap:12px;align-items:center}
.lesson-title h2{font-size:22px}
.prose{display:grid;gap:10px;max-width:65ch}
.prose b{color:var(--tile)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
caption{text-align:left;font-size:13px;color:var(--muted);padding-bottom:6px}
.ex{display:grid;gap:1px;padding:8px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .es{font-weight:600}
.ex .en{color:var(--muted);font-size:14px}
.line{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.line:first-of-type{border-top:0}
.line .who{font-family:var(--f-mono);font-size:12px;color:var(--tile);padding-top:2px}
.line .en{grid-column:2;color:var(--muted);font-size:14px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.vocab div{background:var(--tile-soft);border-radius:10px;padding:8px 10px;min-width:0}
.vocab b{display:block}
.vocab span{font-size:13px;color:var(--muted)}
.q{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{font-size:14px;border-radius:8px;padding:8px 10px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.field{resize:vertical;min-height:52px}
.tip{background:var(--saffron-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.gen{display:grid;gap:10px;justify-items:start}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--tile-soft);border-top-color:var(--tile);animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* cards */
.flash{min-height:220px;display:grid;place-items:center;text-align:center;gap:10px;padding:24px 16px}
.flash .front{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.flash .back{font-size:20px;font-weight:600;color:var(--tile)}
.flash .exs{font-size:14px;color:var(--muted);font-style:italic}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{display:grid;gap:0}
.grade .btn small{font-weight:400;font-size:11px;color:inherit;opacity:.75}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tile);color:var(--surface)}

/* talk */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tile);border-color:var(--tile);color:var(--surface)}
.chip small{font-family:var(--f-mono);font-size:10px;opacity:.7;margin-left:4px}
.chat{display:grid;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;display:grid;gap:6px;overflow-wrap:anywhere}
.msg.ai{background:var(--surface);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:4px}
.msg.me{background:var(--tile);color:var(--surface);justify-self:end;border-bottom-right-radius:4px}
.msg .fix{background:var(--saffron-soft);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:13px}
.msg .tr{color:var(--muted);font-size:13px}
.msg .acts{display:flex;gap:4px}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px;display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:end}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.live{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.iconbtn.send{background:var(--tile);border-color:var(--tile);color:var(--surface)}

/* read */
.para{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.para:first-of-type{border-top:0}
.para .es{font-size:17px;line-height:1.6}
.para .en{color:var(--muted);font-size:14px}
.blur .para .es{filter:blur(5px)}

/* progress */
.check{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.check input{appearance:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check small{display:block;color:var(--muted);font-size:13px}
.ms{font-weight:600}
.ms::before{content:"★ ";color:var(--saffron)}
.hours-big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.hours-big small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.ladder{position:relative;height:40px;margin:4px 12px 0}
.ladder .track{position:absolute;left:0;right:0;top:8px;height:6px;border-radius:99px;background:var(--tile-soft)}
.ladder .fill{position:absolute;left:0;top:8px;height:6px;border-radius:99px;background:var(--saffron)}
.ladder .mk{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;white-space:nowrap}
.ladder .mk::before{content:"";display:block;width:2px;height:22px;margin:0 auto 2px;background:var(--line)}
.ladder .mk.hit{color:var(--ink)}
.ladder .mk.hit::before{background:var(--saffron)}
.show{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.show:first-of-type{border-top:0}
.show .n{font-weight:600}
.show .w{font-size:12px;color:var(--muted);text-align:right}
.show p{grid-column:1/-1;color:var(--muted);font-size:14px}
.subs{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:99px;background:var(--saffron-soft);white-space:nowrap}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.reset{justify-self:start;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:8px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

:root{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
.chat .fb{max-width:100%}
label.btn{display:inline-grid;place-items:center}
.listen-cta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.player{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.12)}
.pwrap{padding-block:8px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pinfo{min-width:0;display:grid;gap:3px}
.pinfo b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:3px;background:var(--tile-soft);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--tile)}
.pctrl{display:flex;gap:2px}
.pbtn{width:40px;height:40px;border:0;background:none;border-radius:10px;font-size:18px;cursor:pointer;color:var(--ink)}
.pbtn.main{background:var(--tile);color:var(--surface)}
.lang{font-style:normal;font-family:var(--f-mono);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--saffron-soft);color:var(--ink);margin-right:4px;vertical-align:1px}
body.has-player main .wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.car{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.carin{width:100%;max-width:560px;display:grid;gap:18px;justify-items:center;text-align:center}
.carin h2{font-size:26px}
.cartext{font-size:24px;line-height:1.35;min-height:5.5em;display:grid;place-items:center;overflow-wrap:anywhere}
.carctrl{display:flex;gap:18px;align-items:center}
.carctrl .pbtn{width:84px;height:84px;font-size:34px;border-radius:50%;background:var(--tile-soft)}
.carctrl .pbtn.main{width:112px;height:112px;font-size:44px;background:var(--tile);color:var(--surface)}
.carauto{display:flex;gap:8px;align-items:center}
.car:has(.plist){place-items:stretch}
.plist{width:100%;max-width:640px;margin:0 auto;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-height:0}
.plhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pllines{margin:0;padding:0;list-style:none;overflow-y:auto;min-height:0;display:grid;gap:4px;align-content:start}
.pllines li{padding:10px 12px;border-radius:10px;cursor:pointer;line-height:1.4;font-size:17px;border:1px solid transparent}
.pllines li.de{font-weight:600}
.pllines li:hover{background:var(--tile-soft)}
.pllines li.cur{background:var(--tile-soft);border-color:var(--tile)}
.plctrl{justify-content:center}
.plctrl .pbtn{width:64px;height:64px;font-size:26px}.plctrl .pbtn.main{width:80px;height:80px;font-size:32px}
nav.bottom .wrap{grid-template-columns:repeat(7,1fr)}
nav.bottom button{font-size:10px}
/* games */
.g-icon{font-size:28px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.g-card.locked{opacity:.65}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.g-score{font-family:var(--f-mono);font-size:14px}
.g-prog{height:6px;border-radius:6px;background:var(--tile-soft);overflow:hidden}
.g-prog i{display:block;height:100%;background:var(--saffron);transition:width .3s}
.g-stage{display:grid;gap:14px;min-height:340px;align-content:start}
.g-arena{position:relative;height:300px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.g-fall{position:absolute;left:50%;top:0;transform:translateX(-50%);text-align:center;display:grid;gap:2px;animation-name:gfall;animation-timing-function:linear;animation-fill-mode:forwards}
.g-fall b{font-size:30px;font-family:var(--f-display)}
.g-fall small{color:var(--muted)}
@keyframes gfall{from{top:0}to{top:calc(100% - 64px)}}
.g-arts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g-art{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.g-der{color:#2d6cdf}.g-die{color:#d6336c}.g-das{color:#2f9e44}
.g-art.right{background:var(--ok-soft);border-color:var(--ok)}.g-art.wrong{background:var(--bad-soft);border-color:var(--bad)}
.g-hint{color:var(--muted);font-style:italic}
.g-line{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.g-line.right{border-color:var(--ok);background:var(--ok-soft)}.g-line.wrong{border-color:var(--bad);background:var(--bad-soft)}
.g-bank{display:flex;flex-wrap:wrap;gap:8px}
.g-tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:17px;cursor:pointer;min-height:44px}
.g-tile.in{background:var(--tile-soft);border-color:var(--tile)}
.g-end{font-size:20px;font-weight:700}
.g-listen{display:grid;justify-items:center;gap:8px;padding:12px}
.g-play{width:96px;height:96px;border-radius:50%;border:0;background:var(--tile);color:var(--surface);font-size:40px;cursor:pointer}
